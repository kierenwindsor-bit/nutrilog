<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriLog">

<title>NutriLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--card:#151e30;--card2:#1c2842;--line:#26334f;--teal:#00d4aa;--amber:#fbbf24;--red:#f87171;--purple:#a78bfa;--text:#e8f0fe;--mute:#8da0c0;--sans:'Outfit',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:560px;margin:0 auto}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px;padding-top:calc(14px + env(safe-area-inset-top))}
#nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:13px 4px;background:none;border:0;color:var(--mute);font:600 14px var(--sans)}
#nav button.on{color:var(--teal);box-shadow:inset 0 2px 0 var(--teal)}
button{font-family:var(--sans);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.h b{font-size:16px}
.mono{font-family:var(--mono)}
.sm{font-size:12px;color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:3px}
h1{font-size:20px;margin:0 0 4px}
.bar{margin-bottom:11px}
.bt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bg{height:9px;background:var(--card2);border-radius:5px;overflow:hidden}
.bg i{display:block;height:100%;border-radius:5px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin:4px 4px 0 0}
.chip.warn{background:rgba(248,113,113,.16);color:var(--red);border:1px solid rgba(248,113,113,.5)}
.chip.watch{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.45)}
.alert{padding:8px 10px;border-radius:9px;margin-top:6px;font-size:13px;line-height:1.35}
.alert.warn{background:rgba(248,113,113,.12);border-left:3px solid var(--red)}
.alert.watch{background:rgba(251,191,36,.10);border-left:3px solid var(--amber)}
.alert.tip{background:rgba(0,212,170,.09);border-left:3px solid var(--teal)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(167,139,250,.15);border:1px solid var(--purple);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dnav .dl2{flex:1;text-align:center;font-weight:600}
.dnav button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px}
.dnav button:disabled{opacity:.3}
.btn{background:var(--teal);color:#04241d;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.full{width:100%}
.mini{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.mini.go{background:var(--teal);color:#04241d;border-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:16px var(--sans)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font:600 14px var(--mono)}
.seg button.on{background:var(--teal);color:#04241d;border-color:var(--teal)}
.seg.k button{font:600 12px var(--sans);padding:8px 2px}
.fb{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:600;font-size:13px;line-height:1.25}
.fb span{display:block;font:400 11px var(--mono);color:var(--mute)}
.it{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.itm{flex:1;min-width:0}
.itm b{font-weight:600;font-size:14px;word-break:break-word}
.x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute);font-size:15px;flex:none}
.panel{background:var(--card2);border-radius:12px;padding:12px;margin-top:10px}
.sg{display:flex;justify-content:space-between;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px}
.sg span:first-child{flex:1}
#sug{background:var(--bg);border-radius:9px;margin-top:4px;max-height:260px;overflow-y:auto}
.wr{display:grid;grid-template-columns:62px 1fr 1fr 1fr 44px 1.3fr;gap:4px;font-size:12px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.wr.hd{color:var(--mute);border-top:0}
canvas{width:100%;height:150px;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#0f2a3a;border:1px solid var(--teal);color:var(--text);padding:10px 14px;border-radius:12px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:5px 6px 5px 10px;font-size:13px}
.tag button{background:none;border:0;color:var(--mute);font-size:14px;padding:0 6px}
ul.p{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--mute);line-height:1.5}

.chip.info{background:rgba(167,139,250,.16);color:var(--purple);border:1px solid rgba(167,139,250,.5)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-top:10px}
input[type=checkbox]{width:20px;height:20px;padding:0}
.tg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tg button{min-width:64px}
.paper{background:#fff;color:#111;border-radius:12px;padding:16px;font-size:13px;line-height:1.45}
.paper h2{font-size:18px;margin:0 0 4px}
.paper h3{font-size:14px;margin:14px 0 4px;border-bottom:1px solid #ccc;padding-bottom:2px}
.paper table{width:100%;border-collapse:collapse;font-size:12px}
.paper th,.paper td{border:1px solid #ccc;padding:3px 5px;text-align:left;vertical-align:top}
.paper .m{color:#555;font-size:12px}
.paper p{margin:4px 0}
@media print{#nav,.noprint,#toast{display:none!important}html,body,#app,#view{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important;max-width:none!important}#view{padding:0!important}.paper{border-radius:0;padding:0}}
</style>
</head>

  re:R('fried|fry.?ups?|deep.fat|chips|fries|crisps|tempura|battered|doughnuts?|donuts?|pastr(?:y|ies)|croissants?|pies?|pizza|burgers?|kebabs?|samosas?|spring rolls?|onion rings?|nuggets?|scotch eggs?|sausage rolls?|pasty|pasties|poppadoms?|bhajis?|katsu'),

 {id:'spicy',lvl:'warn',label:'Spicy',tip:'Spicy food can irritate the gut.',

 {id:'sugary',lvl:'warn',label:'Very sugary',tip:'Very sugary food and drink can trigger symptoms.',

  ex:R('diet|zero|sugar.free|no sugar|rice cakes?|oat ?cakes?|fish ?cakes?|crab ?cakes?|potato cakes?')},

];
var VAL_FAT={id:'fat',lvl:'warn',label:'High fat',tip:'35g or more fat in one entry.'};
var VAL_SUG={id:'sugarval',lvl:'warn',label:'Very sugary',tip:'25g or more sugar in one entry.'};
var TAGS={
 fodmap:{label:'Possible high FODMAP',tip:'Matches a common high-FODMAP food. Based on the name only.',

  ex:R('lactose.free|oat milk|almond milk|soya milk|soy milk|coconut milk|green beans?|bean sprouts?|gluten.free|dairy.free')},
 gluten:{label:'Contains gluten',tip:'Wheat, barley or rye based. Based on the name only.',
  re:R('bread|loaf|toast|wraps?|flatbreads?|pasta|spaghetti|couscous|weetabix|biscuits?|rich tea|cakes?|pastr(?:y|ies)|pizza|sandwich|noodles|crumpets?|bagels?|croissants?|fajitas|rusks?|semolina|barley|rye|battered|breaded|pie|pies'),

  ex:R('lactose.free|oat milk|almond milk|soya milk|soy milk|coconut milk|dairy.free|peanut|cream cracker')}
};
var CAFF=R('espresso|cappuccino|latte|americano|flat white|mocha|coffee|black tea|builders?|pg tips|tea|green tea|earl grey|matcha|cola|coke|energy drinks?|red bull|monster');
var CAFF_EX=R('decaf|herbal|peppermint|camomile|chamomile|fruit tea|rich tea|teacakes?|rooibos|mint tea|ginger tea');
var FRUIT=R('apples?|bananas?|oranges?|berries|berry|strawberr(?:y|ies)|raspberr(?:y|ies)|blueberr(?:y|ies)|grapes?|pears?|peach(?:es)?|plums?|mango(?:es)?|melon|kiwis?|pineapple|satsumas?|clementines?|tangerines?|cherries|apricots?|nectarines?');

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function num(v){if(v===''||v==null)return undefined;var x=parseFloat(v);return isFinite(x)&&x>=0?x:undefined;}
function r1(x){return Math.round(x*10)/10;}
function fmt(x){var v=r1(x);return Number.isInteger(v)?String(v):v.toFixed(1);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function pad(n){return String(n).padStart(2,'0');}
function now(){return new Date();}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function mondayOf(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function todayIso(){return iso(now());}
function nowHM(){var d=now();return pad(d.getHours())+':'+pad(d.getMinutes());}
function dayLabel(s){var d=parse(s);return DAYN[(d.getDay()+6)%7]+' '+d.getDate()+' '+MON[d.getMonth()];}
var toastTimer=null;
function toast(msg,ms){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},ms||2500);}

/* ---------- settings ---------- */
var cfg={targets:Object.assign({},DEFAULT_TARGETS),cont:Object.assign({},DEFAULT_CONT),words:[],tags:{fodmap:false,gluten:false,lactose:false}};
function loadCfg(){
  try{
    var s=JSON.parse(localStorage.getItem('nutrilog_gut_settings')||'null');
    if(s&&typeof s==='object'){
      Object.keys(DEFAULT_TARGETS).forEach(function(k){var v=parseFloat(s.targets&&s.targets[k]);if(isFinite(v)&&v>0)cfg.targets[k]=v;});
      Object.keys(DEFAULT_CONT).forEach(function(k){var v=parseFloat(s.cont&&s.cont[k]);if(isFinite(v)&&v>0)cfg.cont[k]=v;});
      cfg.words=Array.isArray(s.words)?s.words.filter(function(w){return typeof w==='string'&&w.trim();}):[];
      if(s.tags)Object.keys(cfg.tags).forEach(function(k){cfg.tags[k]=!!s.tags[k];});
    }
  }catch(e){}
}
function saveCfg(){try{localStorage.setItem('nutrilog_gut_settings',JSON.stringify(cfg));}catch(e){toast('Could not save settings');}}

/* ---------- store ---------- */
var store={};
function blank(date){return{date:date,weight:'',meals:{breakfast:[],lunch:[],snack:[],drink:[],dinner:[]},note:'',fluids:[],gut:[]};}
function norm(d,date){
  d=d&&typeof d==='object'?d:{};
  d.date=date;
  if(d.weight==null)d.weight='';
  if(!d.meals||typeof d.meals!=='object')d.meals={};
  SLOTS.forEach(function(s){
    var a=d.meals[s[0]];
    d.meals[s[0]]=Array.isArray(a)?a.filter(function(x){return x&&typeof x==='object';}):[];
    d.meals[s[0]].forEach(function(it){
      if(!it.id)it.id=uid();
      it.name=String(it.name==null?'':it.name);
      ['kcal','protein','fat','carbs'].forEach(function(k){var v=parseFloat(it[k]);it[k]=isFinite(v)?v:0;});
      ['fibre','satfat','sugar'].forEach(function(k){var v=parseFloat(it[k]);if(it[k]===''||it[k]==null||!isFinite(v))delete it[k];else it[k]=v;});
    });
  });
  d.fluids=Array.isArray(d.fluids)?d.fluids.filter(function(x){return x&&isFinite(parseFloat(x.ml));}):[];
  d.fluids.forEach(function(f){if(!f.id)f.id=uid();f.ml=parseFloat(f.ml);});
  d.gut=Array.isArray(d.gut)?d.gut.filter(function(x){return x&&typeof x==='object';}):[];
  d.gut.forEach(function(g){if(!g.id)g.id=uid();});
  if(typeof d.note!=='string')d.note='';
  return d;
}
function isEmpty(d){return !d.weight&&!d.note&&!d.fluids.length&&!d.gut.length&&SLOTS.every(function(s){return !d.meals[s[0]].length;});}
function save(){
  Object.keys(store).forEach(function(k){if(isEmpty(store[k]))delete store[k];});
  try{localStorage.setItem('nutrilog_days',JSON.stringify(store));}catch(e){toast('Could not save (storage full or blocked)');}
}
function loadStore(){
  var raw={};
  try{raw=JSON.parse(localStorage.getItem('nutrilog_days')||'{}')||{};}catch(e){raw={};}
  store={};
  Object.keys(raw).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k))store[k]=norm(raw[k],k);});
  var seeded=false;
  try{seeded=localStorage.getItem('nutrilog_gut_seeded')==='1';}catch(e){}
  if(!seeded){
    Object.keys(SEED).forEach(function(k){if(!store[k])store[k]=norm(null,k);if(!store[k].weight)store[k].weight=SEED[k];});
    try{localStorage.setItem('nutrilog_gut_seeded','1');}catch(e){}
    save();
  }
}
function peek(date){return store[date]||blank(date);}
function getDay(date){if(!store[date])store[date]=blank(date);return store[date];}

/* history of foods the user has saved */
function loadHist(){try{var h=JSON.parse(localStorage.getItem('nutrilog_gut_history')||'[]');return Array.isArray(h)?h:[];}catch(e){return[];}}
function addHist(it){
  var h=loadHist().filter(function(x){return x.name.toLowerCase()!==it.name.toLowerCase();});
  var c={name:it.name,kcal:it.kcal,protein:it.protein,fat:it.fat,carbs:it.carbs};
  ['fibre','satfat','sugar'].forEach(function(k){if(it[k]!==undefined)c[k]=it[k];});
  h.unshift(c);
  try{localStorage.setItem('nutrilog_gut_history',JSON.stringify(h.slice(0,150)));}catch(e){}
}
function legacyHist(){
  try{
    var h=JSON.parse(localStorage.getItem('nutrilog_meal_history')||'[]');
    if(!Array.isArray(h))h=Object.keys(h||{}).map(function(k){return h[k];});
    return h.filter(function(x){return x&&typeof x.name==='string'&&isFinite(parseFloat(x.kcal));}).map(function(x){
      return{name:x.name,kcal:parseFloat(x.kcal),protein:parseFloat(x.protein)||0,fat:parseFloat(x.fat)||0,carbs:parseFloat(x.carbs)||0};});
  }catch(e){return[];}
}

/* ---------- calculations ---------- */
function items(d){var a=[];SLOTS.forEach(function(s){d.meals[s[0]].forEach(function(it){a.push(it);});});return a;}
function totals(d){
  var t={kcal:0,protein:0,fat:0,carbs:0,fibre:0,satfat:0,sugar:0,n:0,nFibre:0,nSat:0,nSugar:0,fluid:0};
  items(d).forEach(function(it){
    t.n++;t.kcal+=it.kcal;t.protein+=it.protein;t.fat+=it.fat;t.carbs+=it.carbs;
    if(it.fibre!==undefined){t.fibre+=it.fibre;t.nFibre++;}
    if(it.satfat!==undefined){t.satfat+=it.satfat;t.nSat++;}
    if(it.sugar!==undefined){t.sugar+=it.sugar;t.nSugar++;}
  });
  d.fluids.forEach(function(f){t.fluid+=f.ml;});
  return t;
}
function flagsFor(it){
  var out=[],nm=it.name||'';
  RULES.forEach(function(r){if(r.re.test(nm)&&!(r.ex&&r.ex.test(nm)))out.push(r);});
  if(!out.some(function(r){return r.id==='fried';})&&it.fat>=HIGH_FAT)out.push(VAL_FAT);
  if(!out.some(function(r){return r.id==='sugary';})&&it.sugar!==undefined&&it.sugar>=HIGH_SUGAR)out.push(VAL_SUG);
  cfg.words.forEach(function(w){if(nm.toLowerCase().indexOf(w.toLowerCase())>=0)out.push({id:'custom',lvl:'warn',label:'Personal: '+w,tip:'On your personal list.'});});
  Object.keys(TAGS).forEach(function(k){
    var tg=TAGS[k];
    if(cfg.tags[k]&&tg.re.test(nm)&&!(tg.ex&&tg.ex.test(nm)))out.push({id:'tag_'+k,lvl:'watch',label:tg.label,tip:tg.tip});
  });
  if(it.test)out.push({id:'test',lvl:'info',label:'Test food',tip:'Marked as a test food.'});
  return out;
}
function caffCount(d){
  var fl=d.fluids.filter(function(f){return f.kind==='caffeinated';}).length;
  var fd=items(d).filter(function(it){return CAFF.test(it.name)&&!CAFF_EX.test(it.name);}).length;
  return Math.max(fl,fd);
}
function fruitCount(d){return items(d).filter(function(it){return FRUIT.test(it.name)&&!FRUIT_EX.test(it.name);}).length;}
function fizzyCount(d){return d.fluids.filter(function(f){return f.kind==='fizzy';}).length;}
function alerts(d){
  var a=[];
  SLOTS.forEach(function(s){d.meals[s[0]].forEach(function(it){
    var fl=flagsFor(it);
    var w=fl.filter(function(f){return f.lvl==='warn';}),k=fl.filter(function(f){return f.lvl==='watch';});
    if(w.length)a.push({lvl:'warn',text:it.name+': '+w.map(function(f){return f.label;}).join(', ')});
    if(k.length)a.push({lvl:'watch',text:it.name+': '+k.map(function(f){return f.label;}).join(', ')});
  });});
  var c=caffCount(d);
  if(c>CAFF_LIMIT)a.push({lvl:'warn',text:'Caffeine: '+c+' tea or coffee drinks. NHS advice is about '+CAFF_LIMIT+' a day at most.'});
  var fr=fruitCount(d);
  if(fr>FRUIT_LIMIT)a.push({lvl:'watch',text:'Fresh fruit: '+fr+' entries. NHS advice for IBS is about '+FRUIT_LIMIT+' portions a day.'});
  if(fizzyCount(d)>0)a.push({lvl:'warn',text:'Fizzy drink logged. Fizzy drinks can add to bloating.'});
  return a;
}
function dayFlagLabels(d){
  var seen={},out=[];
  items(d).forEach(function(it){flagsFor(it).forEach(function(f){if(!seen[f.label]){seen[f.label]=1;out.push(f.label);}});});
  if(caffCount(d)>CAFF_LIMIT)out.push('Caffeine over limit');
  if(fruitCount(d)>FRUIT_LIMIT)out.push('Fruit over limit');
  if(fizzyCount(d)>0)out.push('Fizzy drink');
  return out;
}
function gutSummary(d){
  var s={n:d.gut.length,bl:0,pn:0,wd:0};
  d.gut.forEach(function(g){s.bl=Math.max(s.bl,+g.bloat||0);s.pn=Math.max(s.pn,+g.pain||0);s.wd=Math.max(s.wd,+g.wind||0);});
  return s;
}
function tips(d,t){
  var out=[];
  if(viewDate!==todayIso())return out;
  var n=now(),h=n.getHours()+n.getMinutes()/60;
  var exp=cfg.targets.fluid*Math.max(0,Math.min(1,(h-7)/14));
  if(h>=11&&t.fluid<exp*0.7)out.push('Fluids are behind: '+Math.round(t.fluid)+' of '+cfg.targets.fluid+' ml. Have a glass of water now.');
  if(h>=15&&t.n>0&&t.fibre<cfg.targets.fibre*0.5)out.push('Fibre is '+fmt(t.fibre)+'g of '+cfg.targets.fibre+'g. Add veg, fruit, oats, beans or wholemeal at your next meal. Build fibre up gradually and drink with it.');
  return out;
}
function banner(){
  var h=now().getHours(),d=peek(todayIso()),miss=[];
  if(h>=20){
    if(!d.meals.dinner.length)miss.push('dinner');
    if(!d.gut.some(function(g){return g.t>='17:00';}))miss.push('a gut journal entry');
    return miss.length?'Evening check in: log '+miss.join(' and ')+'.':null;
  }
  if(h>=14){
    if(!d.meals.lunch.length)miss.push('lunch');
    if(!d.gut.some(function(g){return g.t>='11:00';}))miss.push('a gut journal entry');
    return miss.length?'Lunch check in: log '+miss.join(' and ')+'.':null;
  }
  return null;
}

/* ---------- paste-in import ---------- */
var SLOT_ALIAS={breakfast:'breakfast',lunch:'lunch',snack:'snack',snacks:'snack',drink:'drink',drinks:'drink',dinner:'dinner'};
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&iso(parse(d))===d;}
function parseImport(text,defDate){
  var ok=[],errors=[];
  String(text||'').split(/\r?\n/).forEach(function(raw,i){
    var ln=raw.trim(),L='Line '+(i+1)+': ';
    if(!ln||ln.charAt(0)==='#')return;
    var p=ln.split('|').map(function(x){return x.trim();}),date=defDate;
    if(/^\d{4}-\d{2}-\d{2}$/.test(p[0]))date=p.shift();
    if(!validDate(date)){errors.push(L+'date is not valid');return;}
    if(date>todayIso()){errors.push(L+'date is in the future');return;}
    var slot=SLOT_ALIAS[(p[0]||'').toLowerCase()];
    if(!slot){errors.push(L+'meal must be Breakfast, Lunch, Snack, Drink or Dinner');return;}
    var name=(p[1]||'').slice(0,80);
    if(!name){errors.push(L+'name is missing');return;}
    var kcal=num(p[2]);
    if(kcal===undefined||kcal>5000){errors.push(L+'kcal is missing or not a sensible number');return;}
    for(var k=3;k<=8;k++){if(p[k]!==undefined&&p[k]!==''&&num(p[k])===undefined){errors.push(L+'field '+(k+1)+' is not a number');return;}}
    var it={id:uid(),name:name,kcal:kcal,protein:num(p[3])||0,fat:num(p[4])||0,carbs:num(p[5])||0,time:nowHM()};
    ['fibre','satfat','sugar'].forEach(function(f,j){var v=num(p[6+j]);if(v!==undefined)it[f]=v;});
    ok.push({date:date,slot:slot,it:it});
  });
  return{ok:ok,errors:errors};
}
function importHTML(){
  if(!importOpen)return '<button class="btn ghost full" style="margin-bottom:12px" data-act="importOpen">Paste entries</button>';
  var h='<div class="card"><div class="h"><b>Paste entries</b><span class="sm">one food per line</span></div>'+
    '<div class="sm">Meal | Name | Kcal | Protein | Fat | Carbs | Fibre | Sat fat | Sugars<br>Leave a value empty if unknown. Start a line with a date (2026-11-07 | ...) to log it on another day.</div>'+
    '<textarea id="imp_text" style="min-height:120px;margin-top:8px" placeholder="Snack | Crackers with two hummus | 314 | 6 | 17.6 | 31.5 | 2.9 | 1.6 | 4.6">'+esc(importText)+'</textarea>';
  importErrs.forEach(function(e){h+='<div class="alert warn">'+esc(e)+'</div>';});
  h+='<div class="row" style="margin-top:10px"><button class="btn" data-act="importRun">Add</button><button class="btn ghost" data-act="importCancel">Cancel</button></div></div>';
  return h;
}

/* ---------- patterns and summary ---------- */
function symptomWindow(date){
  var e=peek(date).gut.slice();
  peek(addDays(date,1)).gut.forEach(function(g){if(String(g.t)<'12:00')e.push(g);});
  return e;
}
function isBad(e){return e.some(function(g){return (+g.bloat>=2)||(+g.pain>=2)||(+g.wind>=2);});}
function worst(e){var w={b:0,p:0,w:0};e.forEach(function(g){w.b=Math.max(w.b,+g.bloat||0);w.p=Math.max(w.p,+g.pain||0);w.w=Math.max(w.w,+g.wind||0);});return w;}
function patterns(endIso,nDays){
  endIso=endIso||todayIso();nDays=nDays||28;
  var rows=[],tests=[],today=todayIso(),res={rows:0,lines:[],tests:tests,journaled:0,foodDays:0};
  for(var i=0;i<nDays;i++){
    var date=addDays(endIso,-i),d=peek(date),t=totals(d);
    if(t.n)res.foodDays++;
    if(d.gut.length)res.journaled++;
    var win=symptomWindow(date);
    items(d).forEach(function(it){if(it.test)tests.push({date:date,name:it.name,w:worst(win),n:win.length});});
    if(!t.n||!d.gut.length||date===today)continue;
    var labs=dayFlagLabels(d).filter(function(l){return l!=='Test food';});
    if(t.nFibre>=Math.ceil(t.n/2)&&t.fibre<cfg.targets.fibre*0.67)labs.push('Low fibre day');
    if(t.fluid<cfg.targets.fluid*0.75)labs.push('Low fluid day');
    rows.push({date:date,bad:isBad(win),labs:labs});
  }
  res.rows=rows.length;
  var all={};rows.forEach(function(r){r.labs.forEach(function(l){all[l]=1;});});
  var found=[];
  Object.keys(all).forEach(function(l){
    var ex=rows.filter(function(r){return r.labs.indexOf(l)>=0;}),no=rows.filter(function(r){return r.labs.indexOf(l)<0;});
    if(ex.length<3||no.length<3)return;
    var be=ex.filter(function(r){return r.bad;}).length,bn=no.filter(function(r){return r.bad;}).length;
    var pe=be/ex.length,pn=bn/no.length;
    if(pe-pn>=0.3)found.push({d:pe-pn,text:l+': moderate or worse symptoms on '+be+' of '+ex.length+' days with it, and '+bn+' of '+no.length+' days without.'});
    else if(l==='Low fibre day'&&pn-pe>=0.3)found.push({d:pn-pe,text:'Days with about 20g of fibre or more: moderate or worse symptoms on '+bn+' of '+no.length+' days, against '+be+' of '+ex.length+' low fibre days. Worth mentioning to your doctor.'});
  });
  found.sort(function(a,b){return b.d-a.d;});
  res.lines=found.slice(0,5).map(function(f){return f.text;});
  return res;
}
function testLine(x){return x.name+' ('+x.date+'): '+(x.n?'worst bloating '+x.w.b+', pain '+x.w.p+', wind '+x.w.w+' over the next day':'no journal entries yet');}

function csvCell(s){s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function buildCSV(mon){

  for(i=0;i<7;i++){

      t.n?Math.round(t.kcal-T.kcal):'',t.n?r1(t.protein-T.protein):'',t.n?t.nFibre+'/'+t.n:'',csvCell(dayFlagLabels(d).join('; '))].join(','));
  }

      any=true;
      L.push([DAYN[i],date,s[1],csvCell(it.name),Math.round(it.kcal),r1(it.protein),r1(it.fat),r1(it.carbs),
        it.fibre===undefined?'':r1(it.fibre),it.satfat===undefined?'':r1(it.satfat),it.sugar===undefined?'':r1(it.sugar),
        csvCell(flagsFor(it).map(function(f){return f.label;}).join('; '))].join(','));
    });});
    if(!any)L.push([DAYN[i],date,'','','','','','','','','',''].join(','));
  }
  L.push('');L.push('FLUID LOG');
  L.push('Day,Date,Time,Type,Container,Amount (ml)');
  for(i=0;i<7;i++){
    date=addDays(mon,i);d=peek(date);
    var fl=d.fluids.slice().sort(function(a,b){return String(a.t).localeCompare(String(b.t));});
    fl.forEach(function(f){L.push([DAYN[i],date,f.t||'',KIND_LABEL[f.kind]||f.kind||'',CONT_LABEL[f.cont]||f.cont||'',Math.round(f.ml)].join(','));});
  }
  L.push('');L.push('GUT JOURNAL');
  L.push('Day,Date,Time,Stool (Bristol 1-7),Bloating (0-3),Pain (0-3),Wind (0-3),Notes');

function weightSeries(){
  var pts=[],ema=null;
  Object.keys(store).sort().forEach(function(k){
    var w=parseFloat(store[k].weight);
    if(isFinite(w)&&w>0){ema=ema===null?w:ema+0.1*(w-ema);pts.push({d:k,w:w,t:ema});}
  });
  return pts;
}
function rangePts(){
  var pts=weightSeries();
  if(wrange==='all')return pts;
  var from=addDays(todayIso(),wrange==='4w'?-28:-84);
  return pts.filter(function(p){return p.d>=from;});
}
function drawWeight(){
  var c=$('#wc');if(!c)return;
  var pts=rangePts(),W=c.clientWidth||320,H=150,dpr=window.devicePixelRatio||1;
  c.width=W*dpr;c.height=H*dpr;
  var x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  x.font='11px monospace';
  if(pts.length<2){x.fillStyle='#8da0c0';x.font='13px sans-serif';x.fillText('Weigh in on two or more days to see a trend.',8,H/2);return;}
  var lo=Infinity,hi=-Infinity;
  pts.forEach(function(p){lo=Math.min(lo,p.w,p.t);hi=Math.max(hi,p.w,p.t);});
  var pd=(hi-lo)*0.15||0.5;lo-=pd;hi+=pd;
  var t0=parse(pts[0].d).getTime(),span=Math.max(parse(pts[pts.length-1].d).getTime()-t0,1);
  function X(d){return 36+(parse(d).getTime()-t0)/span*(W-46);}
  function Y(v){return H-22-(v-lo)/(hi-lo)*(H-34);}
  x.strokeStyle='#26334f';x.fillStyle='#8da0c0';x.lineWidth=1;
  for(var g=0;g<3;g++){var v=lo+(hi-lo)*g/2,y=Y(v);x.beginPath();x.moveTo(34,y);x.lineTo(W-6,y);x.stroke();x.fillText(v.toFixed(1),0,y+4);}
  x.fillText(dayLabel(pts[0].d),34,H-6);
  var lastL=dayLabel(pts[pts.length-1].d);x.fillText(lastL,W-6-x.measureText(lastL).width,H-6);
  x.strokeStyle='#00d4aa';x.lineWidth=2.5;x.beginPath();
  pts.forEach(function(p,i){if(i)x.lineTo(X(p.d),Y(p.t));else x.moveTo(X(p.d),Y(p.t));});x.stroke();
  x.fillStyle='#a78bfa';
  pts.forEach(function(p){x.beginPath();x.arc(X(p.d),Y(p.w),3,0,6.3);x.fill();});
}
function parseWeight(s){
  s=String(s).trim().toLowerCase();
  var m=/^(\d+(?:\.\d+)?)\s*(kg|lb|lbs)?$/.exec(s);if(!m)return null;
  var v=parseFloat(m[1]);if(m[2]==='lb'||m[2]==='lbs')v=v/2.20462;
  if(v<30||v>250)return null;
  return v.toFixed(1);
}

/* ---------- suggestions ---------- */
function sugFor(q,slot){
  q=q.trim().toLowerCase();
  var out=[],seen={};
  function add(x){var k=x.name.toLowerCase();if(!seen[k]){seen[k]=1;out.push(x);}}
  if(!q){
    COMMON.filter(function(c){return c.slots.indexOf(slot)>=0;}).forEach(add);
    return out.slice(0,8);
  }
  var words=q.split(/\s+/);
  var pool=loadHist().concat(COMMON,FOODS,legacyHist());
  var hits=[];
  pool.forEach(function(x){
    var n=x.name.toLowerCase();
    if(words.every(function(w){return n.indexOf(w)>=0;})){
      var rank=n.indexOf(q)===0?0:(n.indexOf(' '+words[0])>=0?1:2);
      hits.push({x:x,r:rank,i:hits.length});
    }
  });
  hits.sort(function(a,b){return a.r-b.r||a.i-b.i;});
  hits.forEach(function(h){add(h.x);});
  return out.slice(0,8);
}
function updateSug(){
  var box=$('#sug');if(!box||!panel)return;

  sugList=sugFor(q,panel.slot);

    return '<div class="sg" data-act="pick" data-i="'+i+'"><span>'+esc(s.name)+'</span><span class="mono sm">'+Math.round(s.kcal)+' kcal'+(s.fibre!==undefined?' | '+fmt(s.fibre)+'g fibre':'')+'</span></div>';
  }).join('');
}
function applyBase(){
  var b=panel&&panel.base;if(!b)return;

  $('#pf_name').value=b.name+(mult!==1?' x'+mult:'');
  $('#pf_kcal').value=sc('kcal',true);
  ['protein','fat','carbs','fibre','satfat','sugar'].forEach(function(k){$('#pf_'+k).value=sc(k,false);});
}

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='pf_name'&&panel){panel.sugOpen=true;updateSug();}
  else if(t.id==='pf_mult'&&panel&&panel.base){applyBase();}
  else if(t.dataset&&t.dataset.nut&&panel){panel.base=null;}
});
document.addEventListener('change',function(e){
  if(e.target.id!=='rf')return;
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var b=JSON.parse(fr.result);
      if(!b||b.app!=='nutrilog'||typeof b.days!=='object')throw new Error('bad');
      if(!window.confirm('Replace everything on this phone with this backup?'))return;
      var nd={};Object.keys(b.days).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k))nd[k]=norm(b.days[k],k);});
      store=nd;save();
      if(b.settings){try{localStorage.setItem('nutrilog_gut_settings',JSON.stringify(b.settings));}catch(x){}cfg={targets:Object.assign({},DEFAULT_TARGETS),cont:Object.assign({},DEFAULT_CONT),words:[],tags:{fodmap:false,gluten:false,lactose:false}};loadCfg();}
      if(Array.isArray(b.history)){try{localStorage.setItem('nutrilog_gut_history',JSON.stringify(b.history.slice(0,150)));}catch(x){}}
      panel=null;render();toast('Backup restored');
    }catch(err){toast('That file is not a NutriLog backup');}
  };
  fr.readAsText(file);e.target.value='';
});

/* ---------- clock: midnight rollover and banner refresh ---------- */
function tick(){
  try{
    var t=todayIso(),rolled=t!==lastToday;
    if(rolled){
      if(viewDate===lastToday)viewDate=t;
      if(weekStart===mondayOf(lastToday))weekStart=mondayOf(t);
      lastToday=t;
    }
    var b=banner()||'';
    var typing=document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if((b!==lastBanner||rolled)&&!panel&&!typing){lastBanner=b;render();}
    else lastBanner=b;
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
setInterval(tick,60000);

/* ---------- start ---------- */
loadCfg();loadStore();
lastBanner=banner()||'';
render();
window.NL={parseImport:parseImport,patterns:patterns,buildSummary:buildSummary,store:function(){return store;},cfg:function(){return cfg;},flagsFor:flagsFor,caffCount:caffCount,fruitCount:fruitCount,buildCSV:buildCSV,totals:totals,peek:peek,alerts:alerts,
  parseWeight:parseWeight,tick:tick,mondayOf:mondayOf,addDays:addDays,sugFor:sugFor,banner:banner,
  setView:function(d){viewDate=d;render();},state:function(){return{tab:tab,viewDate:viewDate,weekStart:weekStart};},FOODS:FOODS,COMMON:COMMON,weightSeries:weightSeries};
})();
</script>
